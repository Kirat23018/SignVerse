<!DOCTYPE html>

<head>

<meta http-equiv="Access-Control-Allow-Methods" content="GET">

<link rel="stylesheet" href="https://vhg.cmp.uea.ac.uk/tech/jas/vhg2017/cwa/cwasa.css" />
<style>
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background-color: #e5e7eb;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .CWASAAvatar {
    width: 100% !important;
    height: 100% !important;
    display: flex !important;
    justify-content: center !important;
    align-items: center !important;
    overflow: hidden !important;
  }
  .CWASAAvatar canvas, .CWASAAvatar > * {
    max-width: 100% !important;
    max-height: 100% !important;
    object-fit: contain !important;
    margin: 0 auto !important;
    display: block !important;
  }
</style>
<script type="text/javascript" src="https://vhg.cmp.uea.ac.uk/tech/jas/vhg2017/cwa/allcsa.js"></script>
<script language="javascript">
	// Initial configuration with explicit HTTPS URLs to avoid mixed content blocking on deployed HTTPS sites
	var initCfg = {
		"jasBase": "https://vhg.cmp.uea.ac.uk/tech/jas/vhg2017/",
		"cwaBase": "https://vhg.cmp.uea.ac.uk/tech/jas/vhg2017/cwa/",
		"useCwaConfig": false,
		"useAvatarJARs": true,
		"avJARBase": "https://vhg.cmp.uea.ac.uk/tech/jas/vhg2017/avatars/",
		"sigmlBase": "https://vhg.cmp.uea.ac.uk/tech/jas/vhg2017/sigml/",
		"avsbsl": ["luna", "siggi", "anna", "marc", "francoise"],
		"avSettings": { "avList": "avsbsl", "initAv": "luna" }
	};
</script>

</head>

<body onload="CWASA.init(initCfg);" >

<script language="javascript">

function playText(stext) {
	if (!stext) return;
	try {
		CWASA.playSiGMLText(stext);
	} catch (e) {
		console.warn("CWASA playText error:", e);
	}
}

function stopPlayer() {
	try {
		if (window.CWASA && typeof CWASA.stopSiGML === 'function') {
			CWASA.stopSiGML();
		}
	} catch (e) {
		console.warn("CWASA stop error:", e);
	}
}

function setSiGMLURL(sigmlURL) {
	if (!sigmlURL) return "";
	var url = String(sigmlURL).trim();
	if (!url.startsWith("http://") && !url.startsWith("https://")) {
		var loc = window.location.href;
		var locDir = loc.substring(0, loc.lastIndexOf('/'));
		if (url.startsWith('/')) {
			url = url.substring(1);
		}
		url = locDir + "/" + url;
	}
	var urlEl = document.getElementById("URLText");
	if (urlEl) urlEl.value = url;
	return url;
}

function startPlayer(sigmlURL) {
	if (!sigmlURL) return;
	var fullUrl = setSiGMLURL(sigmlURL);
	
	// Fetch the SiGML content directly, sanitize any BOM, XML declaration, or rogue prolog comments:
	fetch(fullUrl)
		.then(function(response) {
			if (!response.ok) throw new Error("HTTP error " + response.status);
			return response.text();
		})
		.then(function(rawText) {
			if (!rawText) return;
			var clean = rawText.trim();
			// Strip UTF-8 BOM
			if (clean.charCodeAt(0) === 0xFEFF) {
				clean = clean.slice(1);
			}
			var sigmlStart = clean.indexOf("<sigml");
			if (sigmlStart !== -1) {
				clean = clean.substring(sigmlStart);
			}
			var sigmlEnd = clean.lastIndexOf("</sigml>");
			if (sigmlEnd !== -1) {
				clean = clean.substring(0, sigmlEnd + 8);
			}
			clean = clean.replace(/<sigml>\s*-->/gi, '<sigml>');
			
			// Play via playSiGMLText directly
			try {
				CWASA.playSiGMLText(clean);
			} catch (err) {
				console.warn("CWASA.playSiGMLText error, falling back to URL:", err);
				CWASA.playSiGMLURL(fullUrl);
			}
		})
		.catch(function(err) {
			console.warn("Fetch SiGML fallback:", err);
			try {
				CWASA.playSiGMLURL(fullUrl);
			} catch (e) {
				console.warn("CWASA playSiGMLURL fallback error:", e);
			}
		});
}

// Global window message listener for cross-frame commands from React iframe
window.addEventListener('message', function(event) {
	if (!event || !event.data) return;
	
	if (event.data && event.data.type === 'PLAY_SIGML') {
		const sigmlUrl = event.data.payload || event.data.file || event.data.url;
		// CWASA specific call to play the file
		if (typeof CWASA !== 'undefined') {
			if (typeof startPlayer === 'function') {
				startPlayer(sigmlUrl);
			} else if (typeof CWASA.playSiGMLURL === 'function') {
				CWASA.playSiGMLURL(sigmlUrl);
			}
		} else {
			console.log("CWASA player not loaded yet. Target file:", sigmlUrl);
		}
		return;
	}

	var data = event.data;
	if (typeof data === "object") {
		if (data.type === "START_PLAYER") {
			var file = data.file || data.url || data.sigml;
			if (file) startPlayer(file);
		} else if (data.type === "STOP_PLAYER" || data.type === "STOP_SIGML") {
			stopPlayer();
		} else if (data.type === "PLAY_TEXT") {
			if (data.text) playText(data.text);
		}
	} else if (typeof data === "string" && (data.includes(".sigml") || data.startsWith("SignFiles/"))) {
		startPlayer(data);
	}
});

// Real-time broadcast of live gloss & sign/frame details to parent React application
var lastReportedGloss = "";
var lastReportedSF = "";
setInterval(function() {
	var glossEl = document.querySelector(".txtGloss");
	var sfEl = document.querySelector(".txtSF");
	var currentGloss = glossEl ? (glossEl.value || "").trim() : "";
	var currentSF = sfEl ? (sfEl.value || "").trim() : "";

	if (currentGloss !== lastReportedGloss || currentSF !== lastReportedSF) {
		lastReportedGloss = currentGloss;
		lastReportedSF = currentSF;
		if (window.parent && window.parent !== window) {
			window.parent.postMessage({
				type: "CWASA_GLOSS_UPDATE",
				gloss: currentGloss,
				signFrame: currentSF
			}, "*");
		}
	}
}, 80);

</script>

<div style="box-sizing: border-box; width: 100%; height: 100%; padding: 0px; margin: 0px; border: 0px; display: flex; justify-content: center; align-items: center;" >

Sign/Frame:
<input class="txtSF av0" value="0/0" type="text">
</span>

Gloss:
<input class="txtGloss av0" value="" type="text">
</span>

<input type="text" id="URLText" class="txtSiGMLURL av0 undisplayed" value="" />

</td>
</tr>

</body>

</html>
