<html>

<title>SiGML Player Applet loc.2017</title>

<link rel="stylesheet" href="/uea-jas/cwa/cwasa.css" />
<style>
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background-color: #191C1A;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .CWASAAvatar {
    width: 100% !important;
    height: 100% !important;
    display: flex !important;
    justify-content: center !important;
    align-items: center !important;
    overflow: hidden !important;
  }
  .CWASAAvatar canvas, .CWASAAvatar > * {
    max-width: 100% !important;
    max-height: 100% !important;
    object-fit: contain !important;
    margin: 0 auto !important;
    display: block !important;
  }
</style>
<script language="javascript">
	window.xsltUsePolyfillOnlyIfNeeded = true;
	window.xsltDontAutoloadXmlDocs = true;
</script>
<script type="text/javascript" src="/vendor/xslt-polyfill.min.js" charset="utf-8"></script>
<script type="text/javascript" src="/uea-jas/cwa/allcsa.js"></script>
<script language="javascript">
	// Use same-origin /uea-jas proxy (Vite dev/preview + Vercel rewrites) so JAR/XML XHR loads cleanly without CORS errors
	var ueaJasBase = window.location.origin + "/uea-jas/";
	var initCfg = {
		"jasBase": ueaJasBase,
		"cwaBase": ueaJasBase + "cwa/",
		"useCwaConfig": false,
		"useAvatarJARs": true,
		"avJARBase": ueaJasBase + "avatars/",
		"sigmlBase": ueaJasBase + "sigml/",
		"avsbsl": ["luna", "siggi", "anna", "marc", "francoise"],
		"avSettings": { "avList": "avsbsl", "initAv": "luna" }
	};
</script>

</head>

<body onload="initSignVerseAvatar();" >

<script language="javascript">

var VALID_AVATARS = ["luna", "siggi", "anna", "marc", "francoise"];
var isCharacterReady = false;
var isSwitchingAvatar = false;
var isXsltWasmReady = typeof window.xsltPolyfillReady !== "function";
var pendingPlayCmd = null;
var pendingAvatar = null;
var readyPollTimer = null;

if (typeof window.xsltPolyfillReady === "function") {
	window.xsltPolyfillReady()
		.then(function() { isXsltWasmReady = true; })
		.catch(function() { isXsltWasmReady = true; });
}

// UEA's COMMON.jar ships only COMMON/config.xml; CWASA's AvDataAccess.extractAvDef() probes 4 XML tags
// and creates rejected promises for missing optional tags (asd, avDef, nonManuals) on COMMON.
window.addEventListener("unhandledrejection", function(event) {
	var msg = event && event.reason ? String(event.reason.message || event.reason) : "";
	if (/^No (asd|avDef|nonManuals) for COMMON$/.test(msg)) {
		event.preventDefault();
	}
});

function notifyParent(payload) {
	if (window.parent && window.parent !== window) {
		window.parent.postMessage(payload, window.location.origin);
	}
}

function checkCwasaControlsEnabled() {
	var playBtn = document.querySelector(".bttnPlaySiGMLURL");
	var avMenu = document.querySelector(".CWASAAvMenu select");
	var canvas = document.querySelector(".CWASAAvatar canvas");
	return Boolean(
		isXsltWasmReady &&
		canvas &&
		playBtn &&
		!playBtn.disabled &&
		(!avMenu || !avMenu.disabled)
	);
}

function flushQueuedCommands() {
	if (pendingAvatar) {
		var nextAv = pendingAvatar;
		pendingAvatar = null;
		setAvatar(nextAv);
		if (isSwitchingAvatar) return;
	}
	if (pendingPlayCmd && isCharacterReady && !isSwitchingAvatar) {
		var cmd = pendingPlayCmd;
		pendingPlayCmd = null;
		if (cmd.kind === "text") {
			executePlayText(cmd.value);
		} else if (cmd.kind === "url") {
			executeStartPlayer(cmd.value);
		}
	}
}

function startCharacterReadyPoll() {
	if (readyPollTimer) return;
	var startedAt = Date.now();
	readyPollTimer = setInterval(function() {
		if (checkCwasaControlsEnabled()) {
			clearInterval(readyPollTimer);
			readyPollTimer = null;
			isCharacterReady = true;
			isSwitchingAvatar = false;
			notifyParent({ type: "CWASA_STATUS", status: "ready", avatar: (document.querySelector(".CWASAAvMenu select") || {}).value || initCfg.avSettings.initAv });
			flushQueuedCommands();
		} else if (Date.now() - startedAt > 20000) {
			clearInterval(readyPollTimer);
			readyPollTimer = null;
			isSwitchingAvatar = false;
		}
	}, 60);
}

function initSignVerseAvatar() {
	if (typeof CWASA === "undefined" || typeof CWASA.init !== "function") {
		notifyParent({
			type: "CWASA_STATUS",
			status: "error",
			message: "3D Avatar engine (CWASA) could not load. Check internet connection for WebGL assets."
		});
		return;
	}
	try {
		CWASA.init(initCfg);
		startCharacterReadyPoll();
	} catch (e) {
		notifyParent({
			type: "CWASA_STATUS",
			status: "error",
			message: "3D Avatar WebGL initialization failed on this device."
		});
	}
}

function setAvatar(avatarName) {
	if (typeof avatarName !== "string") return;
	var clean = avatarName.trim().toLowerCase();
	if (VALID_AVATARS.indexOf(clean) === -1) return;

	var avSelect = document.querySelector(".CWASAAvMenu select");
	if (!avSelect || avSelect.options.length === 0) {
		pendingAvatar = clean;
		startCharacterReadyPoll();
		return;
	}

	if (avSelect.value === clean && isCharacterReady) {
		notifyParent({ type: "CWASA_STATUS", status: "avatar_changed", avatar: clean });
		return;
	}

	try {
		var hasOption = false;
		for (var i = 0; i < avSelect.options.length; i += 1) {
			if (avSelect.options[i].value === clean) {
				hasOption = true;
				break;
			}
		}
		if (!hasOption) return;

		isSwitchingAvatar = true;
		isCharacterReady = false;
		if (readyPollTimer) {
			clearInterval(readyPollTimer);
			readyPollTimer = null;
		}
		avSelect.value = clean;
		avSelect.dispatchEvent(new Event("change", { bubbles: true }));
		notifyParent({ type: "CWASA_STATUS", status: "avatar_changed", avatar: clean });
		// Defer poll until CWASA's setTimeout(loadNewAvatar, 0) disables controls during JAR fetch
		setTimeout(startCharacterReadyPoll, 50);
	} catch (e) {
		isSwitchingAvatar = false;
		console.warn("Avatar switch error:", e);
	}
}

function executePlayText(stext) {
	if (!stext) return;
	try {
		if (typeof CWASA === "undefined" || typeof CWASA.playSiGMLText !== "function") {
			notifyParent({
				type: "CWASA_STATUS",
				status: "error",
				message: "3D Avatar player unavailable."
			});
			return;
		}
		CWASA.playSiGMLText(stext);
	} catch (e) {
		console.warn("CWASA playText error:", e);
		notifyParent({
			type: "CWASA_STATUS",
			status: "error",
			message: "Could not play this sign sequence on the 3D avatar."
		});
	}
}

function playText(stext) {
	if (!stext) return;
	if (!isCharacterReady || isSwitchingAvatar) {
		pendingPlayCmd = { kind: "text", value: stext };
		startCharacterReadyPoll();
		return;
	}
	executePlayText(stext);
}

function stopPlayer() {
	pendingPlayCmd = null;
	try {
		if (window.CWASA && typeof CWASA.stopSiGML === 'function') {
			CWASA.stopSiGML();
		}
	} catch (e) {
		console.warn("CWASA stop error:", e);
	}
}

function isSafeSigmlPath(sigmlURL) {
	if (!sigmlURL || typeof sigmlURL !== "string") return false;
	var trimmed = sigmlURL.trim();
	if (!trimmed || trimmed.length > 300 || trimmed.indexOf("..") !== -1) return false;
	var lower = trimmed.toLowerCase();
	if (lower.startsWith("http://") || lower.startsWith("https://") || lower.startsWith("//") || lower.startsWith("javascript:") || lower.startsWith("data:")) {
		return false;
	}
	return lower.endsWith(".sigml");
}

function setSiGMLURL(sigmlURL) {
	if (!isSafeSigmlPath(sigmlURL)) return "";
	var url = String(sigmlURL).trim();
	var loc = window.location.href;
	var locDir = loc.substring(0, loc.lastIndexOf('/'));
	if (url.startsWith('/')) {
		url = url.substring(1);
	}
	url = locDir + "/" + url;
	var urlEl = document.getElementById("URLText");
	if (urlEl) urlEl.value = url;
	return url;
}

function executeStartPlayer(sigmlURL) {
	if (!isSafeSigmlPath(sigmlURL)) return;
	var fullUrl = setSiGMLURL(sigmlURL);
	if (!fullUrl) return;

	// Fetch the SiGML content directly, sanitize any BOM, XML declaration, or rogue prolog comments:
	fetch(fullUrl)
		.then(function(response) {
			if (!response.ok) throw new Error("HTTP error " + response.status);
			return response.text();
		})
		.then(function(rawText) {
			if (!rawText) return;
			var clean = rawText.trim();
			if (clean.charCodeAt(0) === 0xFEFF) {
				clean = clean.slice(1);
			}
			var sigmlStart = clean.indexOf("<sigml");
			if (sigmlStart !== -1) {
				clean = clean.substring(sigmlStart);
			}
			var sigmlEnd = clean.lastIndexOf("</sigml>");
			if (sigmlEnd !== -1) {
				clean = clean.substring(0, sigmlEnd + 8);
			}
			clean = clean.replace(/<sigml>\s*-->/gi, '<sigml>');

			try {
				CWASA.playSiGMLText(clean);
			} catch (err) {
				console.warn("CWASA.playSiGMLText error, falling back to URL:", err);
				CWASA.playSiGMLURL(fullUrl);
			}
		})
		.catch(function(err) {
			console.warn("Fetch SiGML fallback:", err);
			notifyParent({
				type: "CWASA_STATUS",
				status: "warning",
				message: "Animation asset unavailable for " + sigmlURL
			});
			try {
				if (typeof CWASA !== "undefined" && typeof CWASA.playSiGMLURL === "function") {
					CWASA.playSiGMLURL(fullUrl);
				}
			} catch (e) {
				console.warn("CWASA playSiGMLURL fallback error:", e);
			}
		});
}

function startPlayer(sigmlURL) {
	if (!isSafeSigmlPath(sigmlURL)) return;
	if (!isCharacterReady || isSwitchingAvatar) {
		pendingPlayCmd = { kind: "url", value: sigmlURL };
		startCharacterReadyPoll();
		return;
	}
	executeStartPlayer(sigmlURL);
}

// Global window message listener for cross-frame commands from same-origin React parent
window.addEventListener('message', function(event) {
	if (!event || !event.data) return;
	if (event.origin && event.origin !== window.location.origin) return;

	if (event.data && event.data.type === 'PLAY_SIGML') {
		var sigmlUrl = event.data.payload || event.data.file || event.data.url;
		if (!isSafeSigmlPath(sigmlUrl)) return;
		startPlayer(sigmlUrl);
		return;
	}

	var data = event.data;
	if (typeof data === "object") {
		if (data.type === "START_PLAYER") {
			var file = data.file || data.url || data.sigml;
			if (isSafeSigmlPath(file)) startPlayer(file);
		} else if (data.type === "STOP_PLAYER" || data.type === "STOP_SIGML") {
			stopPlayer();
		} else if (data.type === "SET_AVATAR") {
			setAvatar(data.avatar);
		} else if (data.type === "PLAY_TEXT") {
			if (typeof data.text === "string" && data.text.indexOf("<sigml") !== -1) {
				playText(data.text);
			}
		}
	} else if (typeof data === "string" && isSafeSigmlPath(data)) {
		startPlayer(data);
	}
});

// Real-time broadcast of live gloss & sign/frame details to parent React application
var lastReportedGloss = "";
var lastReportedSF = "";
setInterval(function() {
	var glossEl = document.querySelector(".txtGloss");
	var sfEl = document.querySelector(".txtSF");
	var currentGloss = glossEl ? (glossEl.value || "").trim() : "";
	var currentSF = sfEl ? (sfEl.value || "").trim() : "";

	if (currentGloss !== lastReportedGloss || currentSF !== lastReportedSF) {
		lastReportedGloss = currentGloss;
		lastReportedSF = currentSF;
		if (window.parent && window.parent !== window) {
			window.parent.postMessage({
				type: "CWASA_GLOSS_UPDATE",
				gloss: currentGloss,
				signFrame: currentSF
			}, window.location.origin);
		}
	}
}, 80);

</script>

<div style="box-sizing: border-box; width: 100%; height: 100%; padding: 0px; margin: 0px; border: 0px; display: flex; justify-content: center; align-items: center;" >
<table align="center" style="width: 100%; height: 100%; border: 0; margin: 0; border-spacing: 0px; border-collapse: collapse;" >
<tr align="center" style="width: 100%; height: 100%;">

<!--================================================================-->
<!-- CWA signing avatar panel 0 -->
<!--================================================================-->
<td width="100%" height="100%" align="center" valign="middle" style="width: 100%; height: 100%; padding: 0; margin: 0;">
	<div class="CWASAAvatar av0" align="center" style="width: 100%; height: 100%;"></div>
</td>
<!--================================================================-->

</tr>

<!-- Legacy debug controls hidden so 100% of the canvas area is centered 3D avatar -->
<tr style="display: none !important;">

<td align="center" bgcolor="#A3B8D2">

<span class="CWASAAvMenu av0" ></span>
<input type="button" value="Sign" class="bttnPlaySiGMLURL av0" />
<input type="button" value="Stop" class="bttnStop av0" />
<span class="CWASASpeed av0" ></span>

<span style="font-size: 90%;" >
Sign/Frame:
<input class="txtSF av0" value="0/0" type="text">
</span>
<br>
<span style="font-size: 200%;" >
Gloss:
<input class="txtGloss av0" value="" type="text">
</span>

<!--  CachedSiGML URL  -->
<input type="text" id="URLText" class="txtSiGMLURL av0 undisplayed" value="" />

</td>
</tr>
</table>

</div>

</body>

</html>
